<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oath — Study for U.S. Citizenship</title>
<style>
:root{
  --navy:#1b2f4b; --navy-deep:#12233a; --cream:#faf6ec; --paper:#fffdf7;
  --gold:#b08a2e; --gold-soft:#efe3c2; --ink:#232b36; --muted:#5f6c7e;
  --line:#e4dabd; --red:#a83a2a; --green:#2c7a4b; --blue:#2a5f9e;
  --radius:14px; --shadow:0 2px 10px rgba(27,47,75,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--cream); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5; padding-bottom:92px;}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;}
header.top{position:sticky; top:0; z-index:50; background:linear-gradient(180deg,var(--navy-deep),var(--navy));
  color:#fff; padding:14px 18px 12px; box-shadow:0 2px 8px rgba(0,0,0,.25);}
.top-inner{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:12px;}
.emblem{width:44px; height:44px; flex:0 0 44px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #d9b64a, var(--gold) 70%);
  display:flex; align-items:center; justify-content:center; font-size:24px; color:#12233a;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
.top h1{font-size:22px; margin:0; letter-spacing:.5px;}
.top .sub{font-size:12.5px; color:#d8e2f0; margin:1px 0 0;}
.lang-toggle{margin-left:auto; display:flex; background:rgba(255,255,255,.14); border-radius:999px; padding:3px;}
.lang-toggle button{border:0; background:transparent; color:#fff; font-size:14px; font-weight:700;
  padding:7px 14px; border-radius:999px; cursor:pointer;}
.lang-toggle button.on{background:#fff; color:var(--navy-deep);}
main{max-width:860px; margin:0 auto; padding:16px 14px 30px;}
.view{display:none;} .view.on{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; margin:0 0 14px;}
.card h2{margin:0 0 8px; font-size:20px; color:var(--navy);}
.card h3{margin:14px 0 6px; font-size:16px; color:var(--navy);}
.card p{margin:8px 0;}
.filing{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
.filing button{flex:1 1 200px; border:2px solid var(--line); background:#fff; border-radius:12px;
  padding:12px; font-size:15px; font-weight:600; color:var(--navy); cursor:pointer;}
.filing button.on{border-color:var(--gold); background:#fdf8ea; box-shadow:0 0 0 1px var(--gold);}
.note{font-size:13.5px; color:var(--muted);}
.warnbox{border:1px solid #d9a49a; background:#fdf0ec; border-radius:10px; padding:10px 12px;
  font-size:14px; margin:10px 0;}
.warnbox b{color:var(--red);}
.goldbox{border:1px solid var(--gold-soft); background:#fdf8ea; border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0;}
a{color:var(--blue);}
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:8px 14px; font-size:14px; font-weight:600; color:var(--navy); cursor:pointer; white-space:nowrap;}
.chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
.qcard{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin:0 0 12px; overflow:hidden;}
.qhead{display:flex; align-items:flex-start; gap:10px; padding:14px 14px 12px; cursor:pointer;}
.qnum{flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.qnum.star{background:var(--gold);}
.qtext{font-size:17px; font-weight:600; color:var(--ink); flex:1;}
.qmeta{display:flex; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap;}
.tag{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.3px;}
.tag.cat{background:#e9eef5; color:var(--navy);}
.tag.star65{background:var(--gold-soft); color:#7a5f16;}
.tag.varies{background:#fbe3dc; color:var(--red);}
.qactions{display:flex; gap:8px; padding:0 14px 6px;}
.iconbtn{border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 12px;
  font-size:14px; cursor:pointer; color:var(--navy); font-weight:600;}
.iconbtn:active{transform:scale(.96);}
.iconbtn.known-on{background:#e6f2ea; border-color:var(--green); color:var(--green);}
.qbody{display:none; border-top:1px dashed var(--line); padding:12px 14px 14px; background:#fffdf4;}
.qcard.open .qbody{display:block;}
.qbody ul{margin:6px 0 4px; padding-left:20px;}
.qbody li{margin:5px 0; font-size:15.5px;}
.qbody .alabel{font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--paper);
  border-top:1px solid var(--line); box-shadow:0 -2px 12px rgba(27,47,75,.1);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom));}
.tabs-inner{max-width:860px; margin:0 auto; display:flex;}
.tab{flex:1; border:0; background:none; cursor:pointer; padding:8px 2px 6px; color:var(--muted);
  font-size:11px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px;}
.tab .ti{font-size:21px;}
.tab.on{color:var(--navy);}
.tab.on .ti{transform:scale(1.12);}
.btn{display:inline-block; border:0; border-radius:12px; padding:13px 22px; font-size:16px; font-weight:700;
  cursor:pointer; background:var(--navy); color:#fff; margin:6px 6px 6px 0;}
.btn.gold{background:var(--gold); color:#12233a;}
.btn.ghost{background:#fff; color:var(--navy); border:2px solid var(--line);}
.btn:active{transform:scale(.97);}
.btn.big{width:100%; font-size:17px; padding:15px;}
.progress{height:10px; background:#e8e2cf; border-radius:999px; overflow:hidden; margin:10px 0;}
.progress > div{height:100%; background:linear-gradient(90deg,var(--gold),#d9b64a); border-radius:999px; transition:width .3s;}
.scorebar{display:flex; gap:10px; margin:12px 0; flex-wrap:wrap;}
.scorepill{flex:1 1 120px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center;}
.scorepill b{display:block; font-size:24px;}
.scorepill.ok b{color:var(--green);} .scorepill.bad b{color:var(--red);}
.scorepill span{font-size:12.5px; color:var(--muted);}
.result{font-size:26px; font-weight:800; text-align:center; margin:8px 0;}
.result.pass{color:var(--green);} .result.fail{color:var(--red);}
.vocabchips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.vchip{border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 13px;
  font-size:15px; cursor:pointer; font-weight:600; color:var(--navy);}
.vchip:active{background:var(--gold-soft);}
ol.steps{margin:8px 0; padding:0; list-style:none; counter-reset:st;}
ol.steps li{counter-increment:st; position:relative; padding:12px 12px 12px 52px; margin:0 0 10px;
  background:var(--paper); border:1px solid var(--line); border-radius:12px;}
ol.steps li::before{content:counter(st); position:absolute; left:12px; top:12px; width:30px; height:30px;
  border-radius:50%; background:var(--navy); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:15px;}
ol.steps li b{display:block; color:var(--navy); margin-bottom:2px;}
table.fees{width:100%; border-collapse:collapse; margin:8px 0; font-size:15px;}
table.fees td, table.fees th{border:1px solid var(--line); padding:10px; text-align:left;}
table.fees th{background:#f3ecda; color:var(--navy);}
.exgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:560px){.exgrid{grid-template-columns:1fr;}}
.excard{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px;}
.excard b{color:var(--navy); display:block; margin-bottom:4px; font-size:15px;}
.excard p{margin:4px 0; font-size:13.5px; color:var(--muted);}
.reslist{list-style:none; margin:0; padding:0;}
.reslist li{margin:0 0 10px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
.reslist a{font-weight:700; font-size:15.5px; text-decoration:none;}
.reslist a:hover{text-decoration:underline;}
.reslist p{margin:4px 0 0; font-size:13.5px; color:var(--muted);}
footer.disc{max-width:860px; margin:0 auto; padding:6px 18px 20px; font-size:12.5px; color:var(--muted);}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
.pill-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
select,input[type=text]{font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; width:100%;}
.missed{border-left:4px solid var(--red); padding:10px 12px; margin:0 0 10px; background:#fff; border-radius:0 10px 10px 0;}
.missed .mq{font-weight:700;}
.missed .ma{color:var(--muted); font-size:14px;}
@media(min-width:700px){
  .top h1{font-size:26px;}
  .qtext{font-size:18px;}
}
</style>
</head>

  excs:[["50/20","50 años o más con 20+ años como residente permanente: sin examen de inglés. Toma el examen de educación cívica en tu idioma, con tu propio intérprete."],["55/15","55 años o más con 15+ años como residente permanente: sin examen de inglés. Toma el examen de educación cívica en tu idioma, con tu propio intérprete."],["65/20","65 años o más con 20+ años como residente permanente: examen más simple — 10 preguntas de un grupo especial de 20, 6 correctas para aprobar. Puedes usar tu idioma."],["N-648 discapacidad","Un médico licenciado puede certificar una condición médica (12+ meses) que impide los exámenes de inglés o educación cívica. Puedes quedar exento."]],
  resTitle:"Recursos oficiales",
  resIntro:"Confía siempre primero en uscis.gov. Estas son las páginas oficiales detrás de todo lo que hay en esta app:",
  res:[["Examen de Educación Cívica 2025 (oficial)","La página oficial del examen 2025 y el banco de 128 preguntas (PDF).","https://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/2025-civics-test"],["Revisar actualizaciones del examen","Respuestas que cambian (presidente, senadores, gobernador…). Revisa antes de tu entrevista.","https://www.uscis.gov/citizenship/testupdates"],["Estudia para el examen","Todos los materiales oficiales de estudio de USCIS en un lugar.","https://www.uscis.gov/citizenship/find-study-materials-and-resources/study-for-the-test"],["10 pasos a la naturalización","El proceso oficial paso a paso.","https://www.uscis.gov/citizenship/learn-about-citizenship/10-steps-to-naturalization"],["Excepciones y adaptaciones","Excepciones por edad, discapacidad y otras, explicadas.","https://www.uscis.gov/citizenship/exceptions-and-accommodations"],["Recursos multilingües","Materiales oficiales de USCIS en español, árabe, chino, coreano, tagalo, vietnamita (para el examen 2008).","https://www.uscis.gov/citizenship/find-study-materials-and-resources/citizenship-multilingual-resources"],["Preguntas del examen 2008 (texto oficial)","El banco de 100 preguntas para solicitudes presentadas antes del 20 de oct. de 2025.","http://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/study-for-the-test/citizenship-resources-in-text-only-format"],["Solicitud de tarifa reducida","Cómo solicitar la tarifa reducida de $380.","https://www.uscis.gov/forms/filing-fees/additional-information-on-filing-a-reduced-fee-request"]],
  disc:"<b>Solo ayuda de estudio — no es asesoría legal.</b> Las traducciones al español son para ayudarte a estudiar; los materiales oficiales del examen 2025 se publican solo en inglés. Algunas respuestas (presidente, senadores, gobernador…) cambian con el tiempo — revisa siempre <b>uscis.gov/citizenship/testupdates</b> antes de tu entrevista. Contenido de preguntas: USCIS M-1778 (09/25), verificado en septiembre de 2026."
}};

const VARIES_LINK = {
  "senators":"https://www.senate.gov/senators/senators-contact.htm",
  "representative":"https://www.house.gov/representatives/find-your-representative",
  "governor":"https://www.usa.gov/state-governments",
  "state capital":"https://www.usa.gov/state-governments",
  "speaker":"https://www.uscis.gov/citizenship/testupdates",
  "president":"https://www.uscis.gov/citizenship/testupdates",
  "vice president":"https://www.uscis.gov/citizenship/testupdates",
  "chief justice":"https://www.uscis.gov/citizenship/testupdates"
};

/* ---------- state ---------- */
let lang = localStorage.getItem("oath_lang") || "en";
let filed = localStorage.getItem("oath_filed") || "after";
let known = new Set(JSON.parse(localStorage.getItem("oath_known") || "[]"));
let studyCat = "all", studyStar = false, curView = "study";
const T = () => STR[lang];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const saveKnown = () => localStorage.setItem("oath_known", JSON.stringify([...known]));

/* ---------- speech ---------- */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "es" ? "es-US" : "en-US";
    u.rate = 0.88; u.pitch = 1;
    const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang === "es" ? "es" : "en"));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- chrome ---------- */
function renderChrome(){
  document.documentElement.lang = lang;
  document.getElementById("appSub").textContent = T().appSub;
  document.getElementById("langEn").classList.toggle("on", lang==="en");
  document.getElementById("langEs").classList.toggle("on", lang==="es");
  document.getElementById("tabs").innerHTML = T().tabs.map(([id,ic,lb]) =>
    `<button class="tab${curView===id?" on":""}" data-v="${id}"><span class="ti">${ic}</span>${esc(lb)}</button>`).join("");
  document.getElementById("disclaimer").innerHTML = T().disc;
}
function filingCard(){
  const t = T();
  return `<div class="card"><h2>${esc(t.filingTitle)}</h2>
    <div class="filing">
      <button data-f="before" class="${filed==="before"?"on":""}">${esc(t.filedBefore)}</button>
      <button data-f="after" class="${filed==="after"?"on":""}">${esc(t.filedAfter)}</button>
    </div>
    <div class="note" style="margin-top:10px">${filed==="after" ? t.testAfterHTML
      : t.testBeforeHTML + ` <a href="http://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/study-for-the-test/citizenship-resources-in-text-only-format" target="_blank" rel="noopener">${esc(t.testBeforeLink)}</a>`}</div>
  </div>`;
}

/* ---------- study ---------- */
function cats(){ const seen=[]; QUESTIONS.forEach(q=>{ const c=lang==="es"?q.cat_es:q.cat; if(!seen.includes(c)) seen.push(c); }); return seen; }
function renderStudy(){
  const t = T(), el = document.getElementById("v-study");
  const chipAll = `<button class="chip${studyCat==="all"?" on":""}" data-c="all">${esc(t.all)}</button>`;
  const chipStar = `<button class="chip${studyStar?" on":""}" data-s="1">${esc(t.star65)}</button>`;
  const chips = chipAll + cats().map(c=>`<button class="chip${studyCat===c?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("") + chipStar;
  let list = QUESTIONS.filter(q=>{
    if(studyStar && !q.star) return false;
    if(studyCat!=="all" && (lang==="es"?q.cat_es:q.cat)!==studyCat) return false;
    return true;
  });
  const knownN = QUESTIONS.filter(q=>known.has(q.n)).length;
  el.innerHTML = filingCard() + `<div class="card"><h2>${esc(t.studyTitle)}</h2>
    <div class="note">${esc(t.tapReveal)}</div>
    <div class="progress" aria-hidden="true"><div style="width:${(knownN/QUESTIONS.length*100).toFixed(1)}%"></div></div>
    <div class="note">${esc(t.knownCount(knownN, QUESTIONS.length))}</div></div>
    <div class="chips">${chips}</div><div id="qlist"></div>`;
  const ql = el.querySelector("#qlist");
  ql.innerHTML = list.map(q=>{
    const cat = lang==="es"?q.cat_es:q.cat;
    return `<div class="qcard" data-n="${q.n}">
      <div class="qhead" data-act="toggle">
        <div class="qnum${q.star?" star":""}">${q.n}</div>
        <div style="flex:1"><div class="qtext">${esc(q.q[lang])}</div>
        <div class="qmeta"><span class="tag cat">${esc(cat)}</span>
        ${q.star?`<span class="tag star65">★ 65/20</span>`:""}
        ${q.varies?`<span class="tag varies">⚠</span>`:""}</div></div>
      </div>
      <div class="qactions">
        <button class="iconbtn" data-act="speak" aria-label="${esc(t.listen)}">${esc(t.listen)}</button>
        <button class="iconbtn${known.has(q.n)?" known-on":""}" data-act="known">${esc(t.knowIt)}</button>
      </div>
      <div class="qbody">${answerHTML(q)}</div>
    </div>`;
  }).join("");
}
function answerHTML(q){
  const t = T();
  if(q.varies){
    const key = q.varies;
    const linkKey = (key==="speaker"||key==="president"||key==="vice president"||key==="chief justice") ? "office" : key;
    const rawAns = q.a[lang].join("; ");
    const m = rawAns.match(/^(VARIES|VARÍA)\s*[—–-]\s*([^()]+?)\s*\(([^)]*(?:verificado|verified)[^)]*)\)\s*$/i);
    let body = `<div class="warnbox"><b>${esc(t.variesTitle)}.</b> ${esc(t.variesText)}<br>
      <a href="${VARIES_LINK[key]}" target="_blank" rel="noopener">${esc(t.variesLinkLabel[linkKey]||t.variesLinkLabel.office)}</a>`;
    if(m) body += `<br><span class="note">${esc(m[3][0].toUpperCase()+m[3].slice(1))}: <b>${esc(m[2].trim())}</b></span>`;
    else body += `<br><span class="note">${esc(rawAns.replace(/^(VARIES|VARÍA)\s*/i,""))}</span>`;
    return body + `</div>`;
  }
  return `<div class="alabel">${esc(t.answersLabel)}</div><ul>` +
    q.a[lang].map(a=>`<li>${esc(a)}</li>`).join("") + `</ul>`;
}

/* ---------- practice ---------- */
let pz = null;
function renderPractice(){
  const t = T(), el = document.getElementById("v-practice");
  if(!pz){
    el.innerHTML = filingCard() + `<div class="card"><h2>${esc(t.practiceTitle)}</h2>
      <p class="note">${esc(t.practiceIntro)}</p>
      <div class="pill-row">
        <button class="btn big" data-p="std">▶ ${esc(t.testStd)}<br><span style="font-weight:400;font-size:13px">${esc(t.testStdDesc)}</span></button>
        <button class="btn big ghost" data-p="senior">★ ${esc(t.testSenior)}<br><span style="font-weight:400;font-size:13px">${esc(t.testSeniorDesc)}</span></button>
      </div>
      ${filed==="before"?`<div class="warnbox">${esc(t.oldTestNote)} <a href="http://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/study-for-the-test/citizenship-resources-in-text-only-format" target="_blank" rel="noopener">${esc(t.testBeforeLink)}</a></div>`:""}
    </div>`;
    return;
  }
  if(pz.done){ renderPracticeDone(el); return; }
  const q = pz.order[pz.idx], t2 = T();
  el.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>${esc(t2.qNum(pz.idx+1))}</b>
      <span class="note">${esc(t2.correctToPass(pz.need))} · <span style="color:${pz.wrong>0?"var(--red)":"inherit"}">${esc(t2.wrongs(pz.wrong))}</span></span>
    </div>
    <div class="progress"><div style="width:${(pz.right/pz.need*100).toFixed(0)}%"></div></div>
    <h2 style="font-size:21px;margin:10px 0">${esc(q.q[lang])}</h2>
    <button class="iconbtn" data-act="speak">${esc(t2.listen)}</button>
    <div id="pans"></div>
  </div>`;
  const box = el.querySelector("#pans");
  const showAns = ()=>{
    box.innerHTML = answerHTML(q) + `<div class="pill-row">
      <button class="btn" data-r="y" style="background:var(--green)">${esc(t2.iKnew)}</button>
      <button class="btn" data-r="n" style="background:var(--red)">${esc(t2.iMissed)}</button></div>`;
  };
  box.innerHTML = `<button class="btn big" id="showA">${esc(t2.showAnswer)}</button>`;
  box.querySelector("#showA").onclick = showAns;
  el.querySelector('[data-act="speak"]').onclick = ()=>speak(q.q[lang]);
}
function startPractice(mode){
  const senior = mode==="senior";
  const pool = senior ? QUESTIONS.filter(q=>q.star) : [...QUESTIONS];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const total = senior?10:20, need = senior?6:12, maxWrong = senior?5:9;
  pz = {order:pool.slice(0,total), idx:0, right:0, wrong:0, need, maxWrong, missed:[], done:false, senior};
  renderPractice();
}
function practiceAnswer(ok){
  const q = pz.order[pz.idx];
  if(ok) pz.right++; else { pz.wrong++; pz.missed.push(q); }
  pz.idx++;
  if(pz.right>=pz.need || pz.wrong>=pz.maxWrong || pz.idx>=pz.order.length) pz.done = true;
  renderPractice();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderPracticeDone(el){
  const t = T(), pass = pz.right>=pz.need;
  el.innerHTML = `<div class="card" style="text-align:center">
    <div class="result ${pass?"pass":"fail"}">${esc(pass?t.passMsg:t.failMsg)}</div>
    <div class="scorebar">
      <div class="scorepill ok"><b>${pz.right}</b><span>✓</span></div>
      <div class="scorepill bad"><b>${pz.wrong}</b><span>✗</span></div>
      <div class="scorepill"><b>${pz.right}/${pz.idx}</b><span>${esc(t.yourScore)}</span></div>
    </div>
    ${pz.missed.length?`<h3 style="text-align:left">${esc(t.reviewMissed)}</h3>`+pz.missed.map(q=>
      `<div class="missed"><div class="mq">${q.n}. ${esc(q.q[lang])}</div><div class="ma">${esc(q.a[lang].join(" · "))}</div></div>`).join(""):""}
    <button class="btn big gold" id="retry">${esc(t.tryAgain)}</button>
    <button class="btn big ghost" id="newtest">${esc(t.backToSetup)}</button>
  </div>`;
  el.querySelector("#retry").onclick = ()=>startPractice(pz.senior?"senior":"std");
  el.querySelector("#newtest").onclick = ()=>{ pz=null; renderPractice(); };
}

/* ---------- english ---------- */
function renderEnglish(){
  const t = T(), el = document.getElementById("v-english");
  const chips = arr => `<div class="vocabchips">`+arr.map(w=>`<button class="vchip" data-w="${esc(w)}">${esc(w)}</button>`).join("")+`</div>`;
  el.innerHTML = `<div class="card"><h2>${esc(t.writingTitle)}</h2>
    <h3>🗣️ ${esc(t.speakH)}</h3><p>${t.speakP}</p>
    <h3>📖 ${esc(t.readingTitle)}</h3><p>${t.readP}</p>${chips(READING_VOCAB)}
    <h3>✏️ ${esc(t.writingTitle)}</h3><p>${t.writeP}</p>${chips(WRITING_VOCAB)}
  </div>`;
}

/* ---------- process ---------- */
function renderProcess(){
  const t = T(), el = document.getElementById("v-process");
  el.innerHTML = `<div class="card"><h2>${esc(t.procTitle)}</h2>
    <h3>${esc(t.eligH)}</h3><ul>${t.elig.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="card"><h2>${esc(t.stepsH)}</h2><ol class="steps">${t.steps.map(s=>`<li><b>${esc(s[0])}</b>${esc(s[1])}</li>`).join("")}</ol></div>
  <div class="card"><h2>${esc(t.feesH)}</h2>
    <table class="fees">${t.feeRows.map(r=>`<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join("")}</table>
    <p class="note">⚠ ${esc(t.feesNote)}</p></div>
  <div class="card"><h2>${esc(t.excH)}</h2><div class="exgrid">${t.excs.map(e=>`<div class="excard"><b>${esc(e[0])}</b><p>${esc(e[1])}</p></div>`).join("")}</div></div>`;
}

/* ---------- resources ---------- */
function renderResources(){
  const t = T(), el = document.getElementById("v-resources");
  el.innerHTML = `<div class="card"><h2>${esc(t.resTitle)}</h2><p class="note">${esc(t.resIntro)}</p>
    <ul class="reslist">${t.res.map(r=>`<li><a href="${r[2]}" target="_blank" rel="noopener">${esc(r[0])}</a><p>${esc(r[1])}</p></li>`).join("")}</ul></div>`;
}

/* ---------- router & events ---------- */
function show(v){ curView=v; renderChrome();
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  document.getElementById("v-"+v).classList.add("on");
  ({study:renderStudy,practice:renderPractice,english:renderEnglish,process:renderProcess,resources:renderResources})[v]();
  window.scrollTo({top:0});
}
document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab"); if(tab){ show(tab.dataset.v); return; }
  if(e.target.id==="langEn"){ lang="en"; localStorage.setItem("oath_lang",lang); show(curView); return; }
  if(e.target.id==="langEs"){ lang="es"; localStorage.setItem("oath_lang",lang); show(curView); return; }
  const f = e.target.closest("[data-f]"); if(f){ filed=f.dataset.f; localStorage.setItem("oath_filed",filed); show(curView); return; }
  const c = e.target.closest("[data-c]"); if(c){ studyCat=c.dataset.c; renderStudy(); return; }
  const s = e.target.closest("[data-s]"); if(s){ studyStar=!studyStar; renderStudy(); return; }
  const p = e.target.closest("[data-p]"); if(p){ startPractice(p.dataset.p); return; }
  const r = e.target.closest("[data-r]"); if(r){ practiceAnswer(r.dataset.r==="y"); return; }
  const w = e.target.closest("[data-w]"); if(w){ speak(w.dataset.w); return; }
  const card = e.target.closest(".qcard");
  if(card){
    const actBtn = e.target.closest("[data-act]");
    const n = +card.dataset.n, q = QUESTIONS.find(x=>x.n===n);
    if(actBtn){
      const act = actBtn.dataset.act;
      if(act==="toggle"){ card.classList.toggle("open"); }
      else if(act==="speak"){ e.stopPropagation(); speak(q.q[lang]+". "+q.a[lang].join(", ")); }
      else if(act==="known"){ e.stopPropagation(); known.has(n)?known.delete(n):known.add(n); saveKnown(); actBtn.classList.toggle("known-on"); }
      return;
    }
  }
  const head = e.target.closest(".qhead"); if(head){ head.closest(".qcard").classList.toggle("open"); }
});
document.getElementById("langEn").onclick = ()=>{ lang="en"; localStorage.setItem("oath_lang",lang); show(curView); };
document.getElementById("langEs").onclick = ()=>{ lang="es"; localStorage.setItem("oath_lang",lang); show(curView); };
show("study");

</script>
</body>
</html>
