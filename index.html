<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
<title>Oath: Study for U.S. Citizenship</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* One accent, system font, hairlines. Hierarchy comes from size, weight and space. */
:root{
  --bg:#fff; --fg:#16171a; --muted:#6b6f76; --line:#e6e7ea; --hover:#f5f5f6;
  --accent:#0a3161; --on-accent:#fff; --pass:#1a7f37; --fail:#b3261e;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#101113; --fg:#ececee; --muted:#9a9da4; --line:#26282c; --hover:#1a1b1e;
    --accent:#8ab4f8; --on-accent:#0b1220; --pass:#4ac26b; --fail:#ff7b72;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
button,input,textarea{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left;}
a{color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
[tabindex="-1"]:focus{outline:none;}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* frame */
header{display:flex;align-items:center;justify-content:space-between;max-width:600px;margin:0 auto;padding:14px 20px;}
.brand{font-size:17px;font-weight:600;letter-spacing:-.01em;}
.lang button{padding:4px 6px;color:var(--muted);font-size:14px;}
.lang button[aria-pressed="true"]{color:var(--fg);font-weight:600;}
main{max-width:600px;margin:0 auto;padding:8px 20px 120px;}
.view{display:none;} .view.on{display:block;}
footer{max-width:600px;margin:0 auto;padding:0 20px 110px;font-size:13px;color:var(--muted);}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
nav div{display:flex;max-width:600px;margin:0 auto;}
.tab{flex:1;text-align:center;padding:14px 2px;font-size:13px;color:var(--muted);}
.tab[aria-current="page"]{color:var(--fg);font-weight:600;}

/* type */
.title{font-size:30px;line-height:1.15;font-weight:650;letter-spacing:-.02em;margin:16px 0 20px;}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:36px 0 8px;}
p{margin:0 0 12px;}
.muted{color:var(--muted);font-size:15px;}
.sub{display:block;color:var(--muted);font-size:14px;font-weight:400;}
.stat{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:28px 0 10px;}
.num{font-size:44px;font-weight:650;letter-spacing:-.02em;}
.pass{color:var(--pass);} .fail{color:var(--fail);}
.split{display:flex;justify-content:space-between;gap:12px;}
.grow{flex:1;min-width:0;}

/* lists */
.list{list-style:none;margin:0 0 8px;padding:0;border-top:1px solid var(--line);}
.row{display:flex;align-items:baseline;gap:16px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);}
button.row:hover,.qhead:hover{background:var(--hover);}
.detail{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.row.pass .detail{color:var(--pass);} .row.fail .detail{color:var(--fail);}
.row .sub a{margin-bottom:2px;}

/* expandable question rows */
.q{border-bottom:1px solid var(--line);}
.qhead{display:flex;gap:16px;width:100%;padding:14px 0;align-items:baseline;}
.qn{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2ch;}
.known .qn{color:var(--accent);font-weight:600;}
.qt{display:block;font-weight:500;}
.qbody{display:none;padding:0 0 16px calc(2ch + 16px);}
.q.open .qbody{display:block;}
.answers{margin:0 0 12px;padding-left:18px;}
.answers li{margin:4px 0;}
.varies{margin:0 0 12px;}
.answer{font-size:19px;font-weight:600;margin:0;}
.actions{display:flex;gap:20px;}
.link[aria-pressed="true"]{font-weight:600;}

/* controls */
.btn{display:block;width:100%;padding:14px 18px;margin:12px 0 0;border-radius:10px;
  background:var(--accent);color:var(--on-accent);font-weight:600;text-align:center;}
.btn.quiet{background:var(--hover);color:var(--fg);border:1px solid var(--line);}
.btn:active{opacity:.85;}
.link{color:var(--accent);font-size:16px;padding:8px 0;}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.seg{display:flex;gap:20px;margin:0 0 12px;}
.seg button{color:var(--muted);padding:6px 0;border-bottom:2px solid transparent;}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:600;border-color:var(--fg);}
.search,.input,input[type=date]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);margin:0 0 16px;}
.input{margin-top:16px;}
.field{display:flex;align-items:center;gap:16px;}
.field input{width:auto;margin:0;}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 12px;}
.bar div{height:100%;background:var(--accent);}

/* sessions */
.prompt{font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:24px 0 8px;}
.verdict{font-size:20px;font-weight:600;margin:20px 0 0;}
.dw.bad{color:var(--fail);text-decoration:underline;} .dw.ok{color:var(--pass);}
#pans{margin-top:20px;}

/* guide */
details{border-top:1px solid var(--line);}
details:last-of-type{border-bottom:1px solid var(--line);}
summary{padding:16px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;}
summary::-webkit-details-marker{display:none;}
summary::after{content:"+";color:var(--muted);font-weight:400;}
details[open] summary::after{content:"\2212";}
details>ul:not(.list),details>ol{margin:0 0 16px;padding-left:20px;}
details li{margin:6px 0;}
.words{line-height:2;margin-bottom:16px;}
.word{color:var(--accent);margin-right:12px;}
.check{display:flex;gap:12px;align-items:flex-start;padding:8px 0;}
.check input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none;}
details .muted{margin-top:12px;}
</style>
</head>

<script>
const N400 = {"source":"Form N-400, Application for Naturalization, Edition 01/20/25, Part 9. Additional Information About You (in the current edition the yes/no questions are Part 9; Part 12 is now the interpreter section). PDF: https://www.uscis.gov/sites/default/files/document/forms/n-400.pdf (verified 2026-09-14). English questions extracted verbatim. Spanish translations are unofficial study aids produced by the app team, not USCIS translations.","edition":"01/20/25","part":"Part 9. Additional Information About You","questions":[{"item":"1","en":"Have you EVER claimed to be a U.S. citizen (in writing or any other way)?","es":"¿Alguna vez ha afirmado ser ciudadano estadounidense (por escrito o de cualquier otra forma)?","meaning_en":"The officer wants to know if you ever said you were a U.S. citizen when you were not. This includes on job forms or government papers.","meaning_es":"El oficial quiere saber si alguna vez dijo que era ciudadano estadounidense sin serlo. Incluye formularios de trabajo o documentos del gobierno.","expected":"no"},{"item":"2","en":"Have you EVER registered to vote or voted in any Federal, state, or local election in the United States? If you lawfully voted only in a local election where aliens are eligible to vote, you may answer “No.”","es":"¿Alguna vez se ha registrado para votar o ha votado en alguna elección federal, estatal o local en los Estados Unidos? Si votó legalmente solo en una elección local donde los extranjeros pueden votar, puede responder «No».","meaning_en":"Only U.S. citizens may vote in federal and most elections. Registering or voting as a non-citizen is a serious violation.","meaning_es":"Solo los ciudadanos estadounidenses pueden votar en elecciones federales y en la mayoría de las elecciones. Registrarse o votar sin ser ciudadano es una violación grave.","expected":"no"},{"item":"3","en":"Do you currently owe any overdue Federal, state, or local taxes in the United States?","es":"¿Actualmente debe impuestos federales, estatales o locales vencidos en los Estados Unidos?","meaning_en":"You must have filed your taxes and not owe overdue taxes. If you owe, you need an official payment plan with the IRS or tax office.","meaning_es":"Debe haber presentado sus impuestos y no debe tener impuestos vencidos. Si debe, necesita un plan de pago oficial con el IRS o la oficina de impuestos.","expected":"no"},{"item":"4","en":"Since you became a lawful permanent resident, have you called yourself a “nonresident alien” on a Federal, state, or local tax return or decided not to file a tax return because you considered yourself to be a nonresident?","es":"Desde que se convirtió en residente permanente legal, ¿se ha llamado a sí mismo «extranjero no residente» en una declaración de impuestos federal, estatal o local, o decidió no presentar una declaración porque se consideraba no residente?","meaning_en":"As a green card holder you are a U.S. tax resident. Claiming nonresident status on taxes contradicts your permanent resident status.","meaning_es":"Como titular de la tarjeta verde, usted es residente fiscal de EE. UU. Declararse no residente en los impuestos contradice su estatus de residente permanente.","expected":"no"},{"item":"5.a","en":"Have you EVER been a member of, involved in, or in any way associated with any Communist or totalitarian party anywhere in the world?","es":"¿Alguna vez ha sido miembro, ha participado o ha estado asociado de alguna manera con algún partido comunista o totalitario en cualquier parte del mundo?","meaning_en":"The officer asks about membership or support of communist or totalitarian parties, anywhere in the world, at any time.","meaning_es":"El oficial pregunta sobre membresía o apoyo a partidos comunistas o totalitarios, en cualquier parte del mundo y en cualquier momento.","expected":"no"},{"item":"5.b","en":"Have you EVER advocated (supported and promoted) any of the following, or been a member of, involved in, or in any way associated with any group anywhere in the world that advocated any of the following: Opposition to all organized government; World communism; The establishment in the United States of a totalitarian dictatorship; The overthrow by force or violence or other unconstitutional means of the Government of the United States or all forms of law; The unlawful assaulting or killing of any officer or officers of the Government of the United States or of any other organized government because of their official character; The unlawful damage, injury, or destruction of property; or Sabotage?","es":"¿Alguna vez ha defendido (apoyado y promovido) alguna de las siguientes ideas, o ha sido miembro, ha participado o ha estado asociado con algún grupo en cualquier parte del mundo que defendiera alguna de las siguientes ideas: oposición a todo gobierno organizado; comunismo mundial; el establecimiento en los Estados Unidos de una dictadura totalitaria; el derrocamiento por la fuerza o la violencia u otros medios inconstitucionales del Gobierno de los Estados Unidos o de toda forma de ley; el asalto o asesinato ilegal de cualquier oficial u oficiales del Gobierno de los Estados Unidos o de cualquier otro gobierno organizado por su carácter oficial; el daño, lesión o destrucción ilegal de propiedad; o el sabotaje?","meaning_en":"This lists extreme anti-government ideas. The officer wants to know if you ever supported these ideas or any group that did.","meaning_es":"Esta es una lista de ideas extremas contra el gobierno. El oficial quiere saber si alguna vez apoyó estas ideas o a algún grupo que las apoyara.","expected":"no"},{"item":"6.a","en":"Have you EVER been a member of, involved in, or in any way associated with, or have you EVER provided money, a thing of value, services or labor, or any other assistance or support to a group that used a weapon or explosive with intent to harm another person or cause damage to property?","es":"¿Alguna vez ha sido miembro, ha participado o ha estado asociado de alguna manera con un grupo que usó un arma o explosivo con la intención de dañar a otra persona o causar daño a la propiedad?","meaning_en":"The officer asks if you ever belonged to or helped a violent group that used weapons or explosives to hurt people or damage property.","meaning_es":"El oficial pregunta si alguna vez perteneció o ayudó a un grupo violento que usó armas o explosivos para dañar personas o propiedades.","expected":"no"},{"item":"6.b","en":"Have you EVER been a member of, involved in, or in any way associated with, or have you EVER provided money, a thing of value, services or labor, or any other assistance or support to a group that engaged (participated) in kidnapping, assassination, or hijacking or sabotage of an airplane, ship, vehicle, or other mode of transportation?","es":"¿Alguna vez ha sido miembro, ha participado o ha estado asociado de alguna manera con un grupo que participó en secuestro, asesinato, o secuestro o sabotaje de un avión, barco, vehículo u otro medio de transporte?","meaning_en":"The officer asks about any link to groups involved in kidnapping, assassination, or hijacking.","meaning_es":"El oficial pregunta sobre cualquier vínculo con grupos involucrados en secuestros, asesinatos o secuestros de transporte.","expected":"no"},{"item":"6.c","en":"Have you EVER been a member of, involved in, or in any way associated with, or have you EVER provided money, a thing of value, services or labor, or any other assistance or support to a group that threatened, attempted (tried), conspired (planned with others), prepared, planned, advocated for, or incited (encouraged) others to commit any of the acts listed in Item Numbers 6.a. or 6.b.?","es":"¿Alguna vez ha sido miembro, ha participado o ha estado asociado de alguna manera con un grupo que amenazó, intentó, conspiró (planeó con otros), preparó, planeó, defendió o incitó (animó) a otros a cometer cualquiera de los actos enumerados en los puntos 6.a. o 6.b.?","meaning_en":"This covers even planning or encouraging violent acts, not only doing them yourself.","meaning_es":"Esto incluye incluso planear o animar actos violentos, no solo cometerlos usted mismo.","expected":"no"},{"item":"7.a","en":"Have you EVER ordered, incited, called for, committed, assisted, helped with, or otherwise participated in torture?","es":"¿Alguna vez ha ordenado, incitado, pedido, cometido, ayudado o participado de otra manera en tortura?","meaning_en":"The officer asks if you ever ordered or took part in torture.","meaning_es":"El oficial pregunta si alguna vez ordenó o participó en tortura.","expected":"no"},{"item":"7.b","en":"Have you EVER ordered, incited, called for, committed, assisted, helped with, or otherwise participated in genocide?","es":"¿Alguna vez ha ordenado, incitado, pedido, cometido, ayudado o participado de otra manera en genocidio?","meaning_en":"The officer asks if you ever ordered or took part in genocide (killing a whole group of people).","meaning_es":"El oficial pregunta si alguna vez ordenó o participó en genocidio (matar a todo un grupo de personas).","expected":"no"},{"item":"7.c","en":"Have you EVER ordered, incited, called for, committed, assisted, helped with, or otherwise participated in killing or trying to kill any person?","es":"¿Alguna vez ha ordenado, incitado, pedido, cometido, ayudado o participado de otra manera en matar o intentar matar a alguna persona?","meaning_en":"The officer asks if you ever ordered or took part in killing or trying to kill someone.","meaning_es":"El oficial pregunta si alguna vez ordenó o participó en matar o intentar matar a alguien.","expected":"no"},{"item":"7.d","en":"Have you EVER ordered, incited, called for, committed, assisted, helped with, or otherwise participated in intentionally and severely injuring or trying to injure any person?","es":"¿Alguna vez ha ordenado, incitado, pedido, cometido, ayudado o participado de otra manera en lesionar intencional y gravemente o intentar lesionar a alguna persona?","meaning_en":"The officer asks about seriously hurting someone on purpose.","meaning_es":"El oficial pregunta sobre herir gravemente a alguien a propósito.","expected":"no"},{"item":"7.e","en":"Have you EVER ordered, incited, called for, committed, assisted, helped with, or otherwise participated in any kind of sexual contact or activity with any person who did not consent (did not agree) or was unable to consent (could not agree), or was being forced or threatened by you or by someone else?","es":"¿Alguna vez ha ordenado, incitado, pedido, cometido, ayudado o participado de otra manera en cualquier tipo de contacto o actividad sexual con alguna persona que no dio su consentimiento (no estuvo de acuerdo) o no podía darlo, o que estaba siendo forzada o amenazada por usted o por otra persona?","meaning_en":"The officer asks about any non-consensual sexual activity.","meaning_es":"El oficial pregunta sobre cualquier actividad sexual sin consentimiento.","expected":"no"},{"item":"7.f","en":"Have you EVER ordered, incited, called for, committed, assisted, helped with, or otherwise participated in not letting someone practice his or her religion?","es":"¿Alguna vez ha ordenado, incitado, pedido, cometido, ayudado o participado de otra manera en impedir que alguien practique su religión?","meaning_en":"The officer asks if you ever stopped someone from practicing their religion.","meaning_es":"El oficial pregunta si alguna vez impidió que alguien practicara su religión.","expected":"no"},{"item":"7.g","en":"Have you EVER ordered, incited, called for, committed, assisted, helped with, or otherwise participated in causing harm or suffering to any person because of his or her race, religion, national origin, membership in a particular social group, or political opinion?","es":"¿Alguna vez ha ordenado, incitado, pedido, cometido, ayudado o participado de otra manera en causar daño o sufrimiento a alguna persona por su raza, religión, origen nacional, pertenencia a un grupo social particular u opinión política?","meaning_en":"The officer asks about persecution: hurting someone because of who they are or what they believe.","meaning_es":"El oficial pregunta sobre persecución: dañar a alguien por quién es o en qué cree.","expected":"no"},{"item":"8.a","en":"Have you EVER served in, been a member of, assisted (helped), or participated in any military or police unit?","es":"¿Alguna vez ha servido, ha sido miembro, ha ayudado o ha participado en alguna unidad militar o policial?","meaning_en":"The officer wants to know about any military or police service, in any country.","meaning_es":"El oficial quiere saber sobre cualquier servicio militar o policial, en cualquier país.","expected":"no"},{"item":"8.b","en":"Have you EVER served in, been a member of, assisted (helped), or participated in any armed group (a group that carries weapons), for example: paramilitary unit (a group of people who act like a military group but are not part of the official military), self-defense unit, vigilante unit, rebel group, or guerrilla group?","es":"¿Alguna vez ha servido, ha sido miembro, ha ayudado o ha participado en algún grupo armado (un grupo que porta armas), por ejemplo: unidad paramilitar (un grupo de personas que actúan como un grupo militar pero no forman parte del ejército oficial), unidad de autodefensa, unidad de vigilantes, grupo rebelde o grupo guerrillero?","meaning_en":"This covers unofficial armed groups (rebels, militias, guerrillas), not only official armies.","meaning_es":"Esto incluye grupos armados no oficiales (rebeldes, milicias, guerrillas), no solo ejércitos oficiales.","expected":"no"},{"item":"9","en":"Have you EVER worked, volunteered, or otherwise served in a place where people were detained (forced to stay), for example, a prison, jail, prison camp (a camp where prisoners of war or political prisoners are kept), detention facility, or labor camp, or have you EVER directed or participated in any other activity that involved detaining people?","es":"¿Alguna vez ha trabajado, ha sido voluntario o ha servido de otra manera en un lugar donde se detenía a personas (se las obligaba a quedarse), por ejemplo, una prisión, cárcel, campo de prisioneros (un campo donde se mantiene a prisioneros de guerra o prisioneros políticos), centro de detención o campo de trabajo, o alguna vez ha dirigido o participado en cualquier otra actividad que involucrara detener personas?","meaning_en":"The officer asks if you ever worked at a prison, jail, detention center, or labor camp, or helped detain people.","meaning_es":"El oficial pregunta si alguna vez trabajó en una prisión, cárcel, centro de detención o campo de trabajo, o ayudó a detener personas.","expected":"no"},{"item":"10.a","en":"Were you EVER a part of any group, or did you EVER help any group, unit, or organization that used a weapon against any person, or threatened to do so?","es":"¿Alguna vez fue parte de algún grupo, o ayudó a algún grupo, unidad u organización que usó un arma contra alguna persona o amenazó con hacerlo?","meaning_en":"The officer asks about belonging to or helping any group that used or threatened weapons against people.","meaning_es":"El oficial pregunta sobre pertenecer o ayudar a algún grupo que usó armas contra personas o amenazó con hacerlo.","expected":"no"},{"item":"10.b","en":"If you answered “Yes” to Item Number 10.a., when you were part of this group, or when you helped this group, did you ever use a weapon against another person?","es":"Si respondió «Sí» al punto 10.a., cuando era parte de este grupo o cuando ayudaba a este grupo, ¿alguna vez usó un arma contra otra persona?","meaning_en":"A follow-up: if you were in such a group, did you personally use a weapon against someone?","meaning_es":"Una pregunta de seguimiento: si estaba en tal grupo, ¿usó personalmente un arma contra alguien?","expected":"no"},{"item":"10.c","en":"If you answered “Yes” to Item Number 10.a., when you were part of this group, or when you helped this group, did you ever threaten another person that you would use a weapon against that person?","es":"Si respondió «Sí» al punto 10.a., cuando era parte de este grupo o cuando ayudaba a este grupo, ¿alguna vez amenazó a otra persona con que usaría un arma contra ella?","meaning_en":"A follow-up: did you personally threaten someone with a weapon?","meaning_es":"Una pregunta de seguimiento: ¿amenazó personalmente a alguien con un arma?","expected":"no"},{"item":"11","en":"Have you EVER sold, provided, or transported weapons, or assisted any person in selling, providing, or transporting weapons, which you knew or believed would be used against another person?","es":"¿Alguna vez ha vendido, proporcionado o transportado armas, o ha ayudado a alguna persona a vender, proporcionar o transportar armas, que usted sabía o creía que serían usadas contra otra persona?","meaning_en":"The officer asks about dealing in weapons meant to be used against people.","meaning_es":"El oficial pregunta sobre traficar con armas destinadas a ser usadas contra personas.","expected":"no"},{"item":"12","en":"Have you EVER received any weapons training, paramilitary training, or other military-type training?","es":"¿Alguna vez ha recibido entrenamiento con armas, entrenamiento paramilitar u otro entrenamiento de tipo militar?","meaning_en":"The officer asks about weapons or military-style training outside normal service.","meaning_es":"El oficial pregunta sobre entrenamiento con armas o de tipo militar fuera del servicio normal.","expected":"no"},{"item":"13","en":"Have you EVER recruited (asked), enlisted (signed up), conscripted (required to join), or used any person under 15 years of age to serve in or help an armed group, or attempted or worked with others to do so?","es":"¿Alguna vez ha reclutado (pedido), alistado (inscrito), reclutado forzosamente u usado a alguna persona menor de 15 años para servir o ayudar a un grupo armado, o ha intentado hacerlo o ha trabajado con otros para hacerlo?","meaning_en":"The officer asks about using children under 15 in armed groups (child soldiers).","meaning_es":"El oficial pregunta sobre usar niños menores de 15 años en grupos armados (niños soldados).","expected":"no"},{"item":"14","en":"Have you EVER used any person under 15 years of age to take part in hostilities or attempted or worked with others to do so? This could include participating in combat or providing services related to combat (such as serving as a messenger or transporting supplies).","es":"¿Alguna vez ha usado a alguna persona menor de 15 años para participar en hostilidades, o ha intentado hacerlo o ha trabajado con otros para hacerlo? Esto podría incluir participar en combate o prestar servicios relacionados con el combate (como servir de mensajero o transportar suministros).","meaning_en":"The officer asks about involving children under 15 in fighting or war support.","meaning_es":"El oficial pregunta sobre involucrar a niños menores de 15 años en combates o apoyo a la guerra.","expected":"no"},{"item":"15.a","en":"Have you EVER committed, agreed to commit, asked someone else to commit, helped commit, or tried to commit a crime or offense for which you were NOT arrested?","es":"¿Alguna vez ha cometido, acordado cometer, pedido a otra persona que cometa, ayudado a cometer o intentado cometer un delito o infracción por el cual NO fue arrestado?","meaning_en":"Even crimes you were never arrested for must be disclosed. Answer honestly. Hiding them is worse.","meaning_es":"Incluso los delitos por los que nunca fue arrestado deben declararse. Responda con honestidad: ocultarlos es peor.","expected":"no"},{"item":"15.b","en":"Have you EVER been arrested, cited, detained or confined by any law enforcement officer, military official (in the U.S. or elsewhere), or immigration official for any reason, or been charged with a crime or offense?","es":"¿Alguna vez ha sido arrestado, citado, detenido o confinado por algún oficial de policía, oficial militar (en EE. UU. o en otro lugar) u oficial de inmigración por cualquier motivo, o ha sido acusado de un delito o infracción?","meaning_en":"Any arrest, ticket, or detention anywhere in the world, even if charges were dropped or records cleared, must be disclosed.","meaning_es":"Cualquier arresto, citación o detención en cualquier parte del mundo, incluso si se retiraron los cargos o se borraron los registros, debe declararse.","expected":"no"},{"item":"16","en":"If you received a suspended sentence, were placed on probation, or were paroled, have you completed your suspended sentence, probation, or parole?","es":"Si recibió una sentencia suspendida, fue puesto en libertad condicional (probation) o en libertad bajo palabra (parole), ¿ha completado su sentencia suspendida, libertad condicional o libertad bajo palabra?","meaning_en":"Only applies if you had probation or parole. Then you must have finished it completely.","meaning_es":"Solo aplica si tuvo libertad condicional: entonces debe haberla completado por completo.","expected":"varies"},{"item":"17.a","en":"Have you EVER engaged in prostitution, attempted to procure or import prostitutes or persons for the purpose of prostitution, or received any proceeds or money from prostitution?","es":"¿Alguna vez ha participado en prostitución, ha intentado conseguir o importar prostitutas o personas con fines de prostitución, o ha recibido ganancias o dinero de la prostitución?","meaning_en":"The officer asks about prostitution in any form.","meaning_es":"El oficial pregunta sobre prostitución en cualquier forma.","expected":"no"},{"item":"17.b","en":"Have you EVER manufactured, cultivated, produced, distributed, dispensed, sold, or smuggled (trafficked) any controlled substances, illegal drugs, narcotics, or drug paraphernalia in violation of any law or regulation of a U.S. state, the United States, or a foreign country?","es":"¿Alguna vez ha fabricado, cultivado, producido, distribuido, dispensado, vendido o traficado (contrabandeado) sustancias controladas, drogas ilegales, narcóticos o parafernalia de drogas en violación de cualquier ley o reglamento de un estado de EE. UU., de los Estados Unidos o de un país extranjero?","meaning_en":"The officer asks about making or selling illegal drugs, in any country.","meaning_es":"El oficial pregunta sobre fabricar o vender drogas ilegales, en cualquier país.","expected":"no"},{"item":"17.c","en":"Have you EVER been married to more than one person at the same time?","es":"¿Alguna vez ha estado casado con más de una persona al mismo tiempo?","meaning_en":"The officer asks about polygamy: being married to two people at once.","meaning_es":"El oficial pregunta sobre poligamia: estar casado con dos personas a la vez.","expected":"no"},{"item":"17.d","en":"Have you EVER married someone in order to obtain an immigration benefit?","es":"¿Alguna vez se ha casado con alguien para obtener un beneficio migratorio?","meaning_en":"The officer asks about marriage fraud: marrying only for a green card or visa.","meaning_es":"El oficial pregunta sobre fraude matrimonial: casarse solo por una tarjeta verde o visa.","expected":"no"},{"item":"17.e","en":"Have you EVER helped anyone to enter, or try to enter, the United States illegally?","es":"¿Alguna vez ha ayudado a alguien a entrar, o a intentar entrar, ilegalmente a los Estados Unidos?","meaning_en":"The officer asks about helping anyone cross the border illegally or smuggling people.","meaning_es":"El oficial pregunta sobre ayudar a alguien a cruzar la frontera ilegalmente o traficar personas.","expected":"no"},{"item":"17.f","en":"Have you EVER gambled illegally or received income from illegal gambling?","es":"¿Alguna vez ha jugado ilegalmente o ha recibido ingresos de juegos de azar ilegales?","meaning_en":"The officer asks about illegal gambling.","meaning_es":"El oficial pregunta sobre juegos de azar ilegales.","expected":"no"},{"item":"17.g","en":"Have you EVER failed to support your dependents (pay child support) or to pay alimony (court-ordered financial support after divorce or separation)?","es":"¿Alguna vez ha dejado de mantener a sus dependientes (pagar manutención de hijos) o de pagar pensión alimenticia (apoyo financiero ordenado por un tribunal después de un divorcio o separación)?","meaning_en":"You must have paid court-ordered child support and alimony. Bring proof of payments.","meaning_es":"Debe haber pagado la manutención de hijos y la pensión ordenadas por el tribunal. Lleve comprobantes de pago.","expected":"no"},{"item":"17.h","en":"Have you EVER made any misrepresentation to obtain any public benefit in the United States?","es":"¿Alguna vez ha hecho alguna declaración falsa para obtener algún beneficio público en los Estados Unidos?","meaning_en":"The officer asks about lying to get government benefits like welfare or food stamps.","meaning_es":"El oficial pregunta sobre mentir para obtener beneficios del gobierno como asistencia social o cupones de alimentos.","expected":"no"},{"item":"18","en":"Have you EVER given any U.S. Government officials any information or documentation that was false, fraudulent, or misleading?","es":"¿Alguna vez ha dado a algún funcionario del gobierno de EE. UU. información o documentación falsa, fraudulenta o engañosa?","meaning_en":"The officer asks if you ever gave false papers or information to any U.S. official.","meaning_es":"El oficial pregunta si alguna vez dio documentos o información falsos a algún funcionario de EE. UU.","expected":"no"},{"item":"19","en":"Have you EVER lied to any U.S. Government officials to gain entry or admission into the United States or to gain immigration benefits while in the United States?","es":"¿Alguna vez le ha mentido a algún funcionario del gobierno de EE. UU. para entrar o ser admitido a los Estados Unidos o para obtener beneficios migratorios dentro de los Estados Unidos?","meaning_en":"The officer asks if you ever lied to immigration officers to enter the U.S. or get immigration benefits.","meaning_es":"El oficial pregunta si alguna vez mintió a oficiales de inmigración para entrar a EE. UU. u obtener beneficios migratorios.","expected":"no"},{"item":"20","en":"Have you EVER been placed in removal, rescission, or deportation proceedings?","es":"¿Alguna vez ha sido puesto en proceso de expulsión, rescisión o deportación?","meaning_en":"The officer asks if immigration court proceedings were ever started against you.","meaning_es":"El oficial pregunta si alguna vez se inició un proceso de deportación en su contra.","expected":"no"},{"item":"21","en":"Have you EVER been removed or deported from the United States?","es":"¿Alguna vez ha sido expulsado o deportado de los Estados Unidos?","meaning_en":"The officer asks if you were ever actually deported from the U.S.","meaning_es":"El oficial pregunta si alguna vez fue realmente deportado de EE. UU.","expected":"no"},{"item":"22.a","en":"Are you a male who lived in the United States at any time between your 18th and 26th birthdays? (Do not select “Yes” if you were a lawful nonimmigrant for all of that time period.)","es":"¿Es usted un hombre que vivió en los Estados Unidos en algún momento entre sus 18 y 26 años? (No seleccione «Sí» si fue un no inmigrante legal durante todo ese período.)","meaning_en":"This only applies to men who lived in the U.S. between ages 18 and 26. Women answer No.","meaning_es":"Esto solo aplica a hombres que vivieron en EE. UU. entre los 18 y 26 años. Las mujeres responden No.","expected":"varies"},{"item":"22.b","en":"If you answered “Yes,” to Item Number 22.a., did you register for the Selective Service?","es":"Si respondió «Sí» al punto 22.a., ¿se registró en el Servicio Selectivo?","meaning_en":"Men 18 to 26 in the U.S. must register for Selective Service (the draft list). If you did, answer Yes.","meaning_es":"Los hombres de 18 a 26 años en EE. UU. deben registrarse en el Servicio Selectivo (lista del servicio militar). Si lo hizo, responda Sí.","expected":"varies"},{"item":"23","en":"Have you EVER left the United States to avoid being drafted in the U.S. armed forces?","es":"¿Alguna vez ha salido de los Estados Unidos para evitar ser reclutado en las fuerzas armadas de EE. UU.?","meaning_en":"The officer asks if you ever left the country to dodge the military draft.","meaning_es":"El oficial pregunta si alguna vez salió del país para evadir el reclutamiento militar.","expected":"no"},{"item":"24","en":"Have you EVER applied for any kind of exemption from military service in the U.S. armed forces?","es":"¿Alguna vez ha solicitado algún tipo de exención del servicio militar en las fuerzas armadas de EE. UU.?","meaning_en":"The officer asks if you ever asked to be excused from U.S. military service.","meaning_es":"El oficial pregunta si alguna vez pidió ser eximido del servicio militar de EE. UU.","expected":"no"},{"item":"25","en":"Have you EVER served in the U.S. armed forces?","es":"¿Alguna vez ha servido en las fuerzas armadas de EE. UU.?","meaning_en":"Answer Yes if you served in the U.S. military. This can actually help your case.","meaning_es":"Responda Sí si sirvió en el ejército de EE. UU.; esto puede ayudar a su caso.","expected":"varies"},{"item":"26.a","en":"Are you currently a member of the U.S. armed forces?","es":"¿Es actualmente miembro de las fuerzas armadas de EE. UU.?","meaning_en":"Answer based on your current situation.","meaning_es":"Responda según su situación actual.","expected":"varies"},{"item":"26.b","en":"If you answered “Yes” to Item Number 26.a., are you scheduled to deploy outside the United States, including to a vessel, within the next 3 months? (Call the Military Help Line at 877-247-4645 if you transfer to a new duty station after you file your Form N-400, including if you are deployed outside the United States or to a vessel.)","es":"Si respondió «Sí» al punto 26.a., ¿está programado para desplegarse fuera de los Estados Unidos, incluso a un barco, dentro de los próximos 3 meses? (Llame a la Línea de Ayuda Militar al 877-247-4645 si lo transfieren a una nueva estación después de presentar su Formulario N-400, incluso si es desplegado fuera de los Estados Unidos o a un barco.)","meaning_en":"Only for current service members: are you deploying soon?","meaning_es":"Solo para miembros activos del servicio: ¿será desplegado pronto?","expected":"varies"},{"item":"26.c","en":"If you answered “Yes,” to Item Number 26.a., are you currently stationed outside the United States?","es":"Si respondió «Sí» al punto 26.a., ¿está actualmente estacionado fuera de los Estados Unidos?","meaning_en":"Only for current service members: are you stationed abroad?","meaning_es":"Solo para miembros activos del servicio: ¿está estacionado en el extranjero?","expected":"varies"},{"item":"26.d","en":"If you answered “No” to Item Number 26.a., are you a former U.S. military service member who is currently residing outside of the U.S.?","es":"Si respondió «No» al punto 26.a., ¿es un ex miembro del servicio militar de EE. UU. que actualmente reside fuera de los EE. UU.?","meaning_en":"For veterans living outside the United States.","meaning_es":"Para veteranos que viven fuera de los Estados Unidos.","expected":"varies"},{"item":"27","en":"Have you EVER been court-martialed or have you received a discharge characterized as other than honorable, bad conduct, or dishonorable, while in the U.S. armed forces?","es":"¿Alguna vez ha sido sometido a consejo de guerra o ha recibido una baja caracterizada como «no honorable», «mala conducta» o «deshonrosa» mientras servía en las fuerzas armadas de EE. UU.?","meaning_en":"The officer asks about serious military punishment or a bad discharge.","meaning_es":"El oficial pregunta sobre castigos militares graves o una baja deshonrosa.","expected":"no"},{"item":"28","en":"Have you EVER been discharged from training or service in the U.S. armed forces because you were an alien?","es":"¿Alguna vez fue dado de baja del entrenamiento o servicio en las fuerzas armadas de EE. UU. por ser extranjero?","meaning_en":"The officer asks if you were ever discharged from U.S. military service for not being a citizen.","meaning_es":"El oficial pregunta si alguna vez fue dado de baja del servicio militar de EE. UU. por no ser ciudadano.","expected":"no"},{"item":"29","en":"Have you EVER deserted from the U.S. armed forces?","es":"¿Alguna vez ha desertado de las fuerzas armadas de EE. UU.?","meaning_en":"The officer asks if you ever abandoned military duty without permission.","meaning_es":"El oficial pregunta si alguna vez abandonó el deber militar sin permiso.","expected":"no"},{"item":"30.a","en":"Do you now have, or did you EVER have, a hereditary title or an order of nobility in any foreign country?","es":"¿Tiene ahora, o alguna vez tuvo, un título hereditario o una orden de nobleza en algún país extranjero?","meaning_en":"The officer asks about noble titles (duke, baron, knighthood) from another country.","meaning_es":"El oficial pregunta sobre títulos nobiliarios (duque, barón, caballero) de otro país.","expected":"no"},{"item":"30.b","en":"If you answered “Yes,” to Item Number 30.a., are you willing to give up any inherited titles or orders of nobility, (list titles), that you have in a foreign country at your naturalization ceremony?","es":"Si respondió «Sí» al punto 30.a., ¿está dispuesto a renunciar a cualquier título hereditario u orden de nobleza, (liste los títulos), que tenga en un país extranjero en su ceremonia de naturalización?","meaning_en":"Only if you have a title: you must be willing to give it up when you become a citizen.","meaning_es":"Solo si tiene un título: debe estar dispuesto a renunciar a él al convertirse en ciudadano.","expected":"varies"},{"item":"31","en":"Do you support the Constitution and form of Government of the United States?","es":"¿Apoya la Constitución y la forma de gobierno de los Estados Unidos?","meaning_en":"You must answer Yes. You are promising loyalty to the U.S. Constitution.","meaning_es":"Debe responder Sí: está prometiendo lealtad a la Constitución de EE. UU.","expected":"yes"},{"item":"32","en":"Do you understand the full Oath of Allegiance to the United States (see Part 16. Oath of Allegiance)?","es":"¿Entiende el Juramento de Lealtad completo a los Estados Unidos (ver Parte 16. Juramento de Lealtad)?","meaning_en":"You must answer Yes. You need to understand the oath you will take.","meaning_es":"Debe responder Sí: necesita entender el juramento que hará.","expected":"yes"},{"item":"33","en":"Are you unable to take the Oath of Allegiance because of a physical or developmental disability or mental impairment? If you answer “Yes,” skip Item Numbers 34. - 37. and see the Legal Guardian, Surrogate, or Designated Representative section in the Instructions.","es":"¿No puede hacer el Juramento de Lealtad debido a una discapacidad física o del desarrollo o una deficiencia mental? Si responde «Sí», omita los puntos 34 a 37 y consulte la sección de Tutor Legal, Sustituto o Representante Designado en las Instrucciones.","meaning_en":"Almost everyone answers No. Only answer Yes if a real disability prevents you from taking the oath.","meaning_es":"Casi todos responden No. Solo responda Sí si una discapacidad real le impide hacer el juramento.","expected":"no"},{"item":"34","en":"Are you willing to take the full Oath of Allegiance to the United States?","es":"¿Está dispuesto a hacer el Juramento de Lealtad completo a los Estados Unidos?","meaning_en":"You must answer Yes. Taking the oath is required to become a citizen.","meaning_es":"Debe responder Sí: hacer el juramento es obligatorio para ser ciudadano.","expected":"yes"},{"item":"35","en":"If the law requires it, are you willing to bear arms (carry weapons) on behalf of the United States?","es":"Si la ley lo requiere, ¿está dispuesto a portar armas (llevar armas) en nombre de los Estados Unidos?","meaning_en":"You must answer Yes. You promise to defend the U.S. if the law requires it.","meaning_es":"Debe responder Sí: promete defender a EE. UU. si la ley lo requiere.","expected":"yes"},{"item":"36","en":"If the law requires it, are you willing to perform noncombatant services (do something that does not include fighting in a war) in the U.S. armed forces?","es":"Si la ley lo requiere, ¿está dispuesto a prestar servicios no combatientes (hacer algo que no incluya luchar en una guerra) en las fuerzas armadas de EE. UU.?","meaning_en":"You must answer Yes. For example, working as a nurse or cook in the military if needed.","meaning_es":"Debe responder Sí: por ejemplo, trabajar como enfermero o cocinero en el ejército si es necesario.","expected":"yes"},{"item":"37","en":"If the law requires it, are you willing to perform work of national importance under civilian direction (do non-military work that the U.S. Government says is important to the country)?","es":"Si la ley lo requiere, ¿está dispuesto a realizar trabajos de importancia nacional bajo dirección civil (hacer trabajo no militar que el gobierno de EE. UU. considere importante para el país)?","meaning_en":"You must answer Yes. For example, civilian emergency work the government asks for.","meaning_es":"Debe responder Sí: por ejemplo, trabajo civil de emergencia que pida el gobierno.","expected":"yes"}]};

<script>
/* State: persistence, spaced repetition, streak, countdown, speech, resume snapshots.
   Everything here is UI-free. Keys in localStorage are prefixed oath_. */
/* ---------- state ---------- */
const isPlainObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
function readArray(key, itemTest){
  try{
    const v = JSON.parse(localStorage.getItem(key));
    if(!Array.isArray(v)) return [];
    return itemTest ? v.filter(itemTest) : v;
  }catch(e){ return []; }
}
function readObject(key){
  try{
    const v = JSON.parse(localStorage.getItem(key));
    return isPlainObj(v) ? v : {};
  }catch(e){ return {}; }
}
const isStr = v => typeof v === "string";
let lang = localStorage.getItem("oath_lang") === "es" ? "es" : "en";
let filed = localStorage.getItem("oath_filed") === "before" ? "before" : "after";
let known = new Set(readArray("oath_known", isStr));
let histLog = readArray("oath_history", isPlainObj);
let mistakes = new Set(readArray("oath_mistakes", isStr));
const saveKnown = () => localStorage.setItem("oath_known", JSON.stringify([...known]));
const saveHistory = () => localStorage.setItem("oath_history", JSON.stringify(histLog.slice(-20)));
const saveMistakes = () => localStorage.setItem("oath_mistakes", JSON.stringify([...mistakes].slice(0,500)));
function readSrs(key){
  const out = {}, v = readObject(key);
  for(const k of Object.keys(v)){
    const e = v[k];
    if(isPlainObj(e) && typeof e.ivl === "number" && typeof e.next === "number") out[k] = e;
  }
  return out;
}
let srs = readSrs("oath_srs");
const saveSrs = () => localStorage.setItem("oath_srs", JSON.stringify(srs));
const SRS_IVLS = [1,3,7,14,30];
const srsGet = k => srs[k] || {ivl:1, next:0};
const srsDue = k => srsGet(k).next <= Date.now();
function srsOnMiss(k){ srs[k] = {ivl:1, next:Date.now()}; saveSrs(); }
function srsOnRight(k){
  const i = SRS_IVLS.indexOf(srsGet(k).ivl);
  if(i >= SRS_IVLS.length-1){ mistakes.delete(k); delete srs[k]; }
  else { const ivl = SRS_IVLS[i+1]; srs[k] = {ivl, next:Date.now()+ivl*864e5}; }
  saveMistakes(); saveSrs();
}
let intMistakes = new Set(readArray("oath_int_mistakes", isStr));
const saveIntMistakes = () => localStorage.setItem("oath_int_mistakes", JSON.stringify([...intMistakes].slice(0,40)));
const Q = () => filed==="before" ? QUESTIONS2008 : QUESTIONS;
const qkey = n => (filed==="before"?"08":"25") + ":" + n;
(function migrateKeys(){
  const mig = s => new Set([...s].map(k => String(k).includes(":") ? k : "25:"+k));
  const k2 = mig(known), m2 = mig(mistakes);
  const same = (a,b) => a.size===b.size && [...a].every(k=>b.has(k));
  if(!same(k2,known) || !same(m2,mistakes)){ known=k2; mistakes=m2; saveKnown(); saveMistakes(); }
  let srsTouch = false;
  mistakes.forEach(k=>{ if(!srs[k]){ srs[k]={ivl:1,next:0}; srsTouch=true; } });
  if(srsTouch) saveSrs();
})();


let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate, en){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const useEn = en || lang === "en";
    u.lang = useEn ? "en-US" : "es-US";
    u.rate = rate || 0.88; u.pitch = 1;
    const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(useEn ? "en" : "es"));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}


/* ---------- progress queries ---------- */
function catProgress(cat){
  const qs = Q().filter(q=>q.cat===cat);
  const k = qs.filter(q=>known.has(qkey(q.n))).length;
  return {total:qs.length, known:k, pct:qs.length?Math.round(k/qs.length*100):0};
}
function dueCount(){
  const bank = filed==="before" ? "08:" : "25:";
  return [...mistakes].filter(k=>k.startsWith(bank)&&srsDue(k)).length;
}
function unseenCount(){
  return Q().filter(q=>!known.has(qkey(q.n))).length;
}
function cats(){ const seen=[]; Q().forEach(q=>{ const c=q.cat; if(!seen.includes(c)) seen.push(c); }); return seen; }
function catLabel(enCat){
  const q = Q().find(x=>x.cat===enCat);
  return q ? (lang==="es" ? q.cat_es : q.cat) : enCat;
}

/* ---------- daily streak ---------- */
function dayStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function getStreak(){ const n = readObject("oath_streak").count; return Number.isFinite(n) ? n : 0; }
function bumpStreak(){
  const st = readObject("oath_streak");
  if(!Number.isFinite(st.count)) st.count = 0;
  if(typeof st.last !== "string") st.last = "";
  const t = dayStr(new Date());
  if(st.last!==t){
    const y = new Date(); y.setDate(y.getDate()-1);
    st.count = (st.last===dayStr(y)) ? st.count+1 : 1;
    st.last = t;
    localStorage.setItem("oath_streak", JSON.stringify(st));
  }
  return st.count;
}
/* ---------- interview countdown ---------- */
function getIDate(){
  const v = localStorage.getItem("oath_idate") || "";
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return "";
  const p = v.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  if(isNaN(d.getTime()) || d.getFullYear()!==+p[0] || d.getMonth()!==+p[1]-1 || d.getDate()!==+p[2]) return "";
  return v;
}
function daysLeft(){
  const v = getIDate(); if(!v) return null;
  const p = v.split("-"); if(p.length!==3) return null;
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

/* ---------- checklist ---------- */
function loadCheck(){ return new Set(readArray("oath_checklist", isStr)); }
function saveCheck(set){ localStorage.setItem("oath_checklist", JSON.stringify([...set])); }
function weakestCats(){
  const bank = filed==="before"?"08":"25";
  const agg = {};
  histLog.filter(h=>h.bank===bank && h.cats).forEach(h=>{
    Object.entries(h.cats).forEach(([c,v])=>{
      agg[c] = agg[c] || {r:0,w:0}; agg[c].r += v.r||0; agg[c].w += v.w||0;
    });
  });
  return Object.entries(agg)
    .map(([c,v])=>({c, n:v.r+v.w, acc:v.r/(v.r+v.w)}))
    .filter(r=>r.n>=3).sort((a,b)=>a.acc-b.acc).slice(0,5);
}

/* ---------- session state (one active round per kind; null when idle) ---------- */
let pz = null;   // civics practice
let rp = null;   // reading practice
let dz = null;   // dictation
let ipz = null;  // N-400 interview practice
let mock = null; // full mock interview results so far
let dzMistakes = new Set(readArray("oath_dz_mistakes", isStr));
const saveDzMistakes = () => localStorage.setItem("oath_dz_mistakes", JSON.stringify([...dzMistakes].slice(0,30)));

/* ---------- round snapshots: resume after reload ---------- */
const ROUNDS_KEY = "oath_rounds";
function saveRounds(){
  const snap = {};
  if(pz && !pz.done && pz.idx < pz.order.length){
    snap.practice = {bank: pz.bank, ns: pz.order.map(q=>q.n), idx: pz.idx,
      right: pz.right, wrong: pz.wrong, need: pz.need, maxWrong: pz.maxWrong,
      missed: pz.missed.map(q=>q.n), catRes: pz.catRes,
      senior: !!pz.senior, review: !!pz.review, due: !!pz.due, weak: !!pz.weak, mock: !!pz.mock};
  }
  if(rp && rp.idx < rp.order.length){
    snap.reading = {ss: rp.order.slice(), idx: rp.idx, ok: rp.ok, mock: !!rp.mock};
  }
  if(dz && dz.idx < dz.order.length){
    snap.dict = {ss: dz.order.slice(), idx: dz.idx, ok: dz.ok, mock: !!dz.mock, review: !!dz.review};
  }
  if(ipz && ipz.idx < ipz.order.length){
    snap.interview = {items: ipz.order.map(q=>q.item), idx: ipz.idx, ok: ipz.ok,
      mock: !!ipz.mock, review: !!ipz.review};
  }
  if(mock){
    snap.mock = {read: mock.read|0, dict: mock.dict|0, n400: mock.n400|0,
      civics: mock.civics ? {right: mock.civics.right|0, total: mock.civics.total|0, pass: !!mock.civics.pass} : null};
  }
  try{ localStorage.setItem(ROUNDS_KEY, JSON.stringify(snap)); }catch(e){}
}
function validCatRes(v){
  if(!v || typeof v !== "object" || Array.isArray(v)) return {};
  const out = {};
  for(const k of Object.keys(v)){
    const r = v[k];
    if(r && typeof r === "object" && Number.isInteger(r.r) && r.r >= 0 && Number.isInteger(r.w) && r.w >= 0) out[k] = {r: r.r, w: r.w};
  }
  return out;
}
function restoreRounds(){
  let s; try{ s = JSON.parse(localStorage.getItem(ROUNDS_KEY)); }catch(e){ return; }
  if(!s || typeof s !== "object" || Array.isArray(s)) return;
  const isInt = v => Number.isInteger(v) && v >= 0;
  const p = s.practice;
  if(p && typeof p === "object" && (p.bank === "08" || p.bank === "25") && Array.isArray(p.ns) && p.ns.length){
    const bankQ = p.bank === "08" ? QUESTIONS2008 : QUESTIONS;
    const order = p.ns.filter(Number.isInteger).map(n=>bankQ.find(q=>q.n===n)).filter(Boolean);
    if(order.length && isInt(p.idx) && p.idx < order.length){
      pz = {order, idx: p.idx, right: isInt(p.right)?p.right:0, wrong: isInt(p.wrong)?p.wrong:0,
        need: isInt(p.need)&&p.need>0?p.need:order.length,
        maxWrong: isInt(p.maxWrong)?p.maxWrong:order.length+1,
        missed: (Array.isArray(p.missed)?p.missed:[]).filter(Number.isInteger).map(n=>bankQ.find(q=>q.n===n)).filter(Boolean),
        catRes: validCatRes(p.catRes), done: false, recorded: false,
        senior: !!p.senior, review: !!p.review, due: !!p.due, weak: !!p.weak, mock: !!p.mock, bank: p.bank};
    }
  }
  const r = s.reading;
  if(r && typeof r === "object" && Array.isArray(r.ss) && r.ss.length && r.ss.every(x=>typeof x === "string" && READ_SENTENCES.includes(x))
     && isInt(r.idx) && r.idx < r.ss.length){
    rp = {order: r.ss.slice(), idx: r.idx, ok: isInt(r.ok)?r.ok:0, mock: !!r.mock};
  }
  const z = s.dict;
  if(z && typeof z === "object" && Array.isArray(z.ss) && z.ss.length && z.ss.every(x=>typeof x === "string" && DICT_SENTENCES.includes(x))
     && isInt(z.idx) && z.idx < z.ss.length){
    dz = {order: z.ss.slice(), idx: z.idx, ok: isInt(z.ok)?z.ok:0, mock: !!z.mock, review: !!z.review};
  }
  const iv = s.interview;
  if(iv && typeof iv === "object" && Array.isArray(iv.items) && iv.items.length
     && iv.items.every(x=>typeof x === "string" && N400.questions.some(q=>q.item===x))
     && isInt(iv.idx) && iv.idx < iv.items.length){
    ipz = {order: iv.items.map(it=>N400.questions.find(q=>q.item===it)), idx: iv.idx,
      ok: isInt(iv.ok)?iv.ok:0, mock: !!iv.mock, review: !!iv.review};
  }
  const m = s.mock;
  if(m && typeof m === "object"){
    mock = {read: isInt(m.read)?m.read:0, dict: isInt(m.dict)?m.dict:0, n400: isInt(m.n400)?m.n400:0,
      civics: (m.civics && typeof m.civics === "object") ? {right: isInt(m.civics.right)?m.civics.right:0,
        total: isInt(m.civics.total)?m.civics.total:0, pass: !!m.civics.pass} : undefined};
  }
}


/* ---------- util ---------- */
function shuffled(arr){
  const a = [...arr];
  for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

<script>
/* Views: one render function per screen. Each builds an HTML string into #v-<name>
   and wires its own controls. State lives in state.js; text lives in strings.js. */

const T = () => STR[lang];

/* ---------- study ---------- */
let studyCat = "all", studyStar = false, studyQ = "";
function filteredQuestions(){
  let list = Q().filter(q=>{
    if(studyStar && !q.star) return false;
    if(studyCat!=="all" && q.cat!==studyCat) return false;
    return true;
  });
  const sq = studyQ.trim().toLowerCase();
  if(sq) list = list.filter(q =>
    String(q.n)===sq ||
    q.q.en.toLowerCase().includes(sq) || q.q.es.toLowerCase().includes(sq) ||
    q.a.en.join(" ").toLowerCase().includes(sq) || q.a.es.join(" ").toLowerCase().includes(sq));
  return list;
}
function qCardHTML(q){
  const t = T(), cat = lang==="es" ? q.cat_es : q.cat, isKnown = known.has(qkey(q.n));
  return `<li class="q${isKnown?" known":""}" data-n="${q.n}">
    <button class="qhead" data-act="toggle" aria-expanded="false">
      <span class="qn">${q.n}</span>
      <span class="grow"><span class="qt">${esc(q.q[lang])}</span>
      <span class="sub">${esc(cat)}${q.star?" · 65/20":""}</span></span>
    </button>
    <div class="qbody">
      ${answerHTML(q)}
      <div class="actions">
        <button class="link" data-act="speak">${esc(t.listen)}</button>
        <button class="link" data-act="known" aria-pressed="${isKnown}">${esc(t.knowIt)}</button>
      </div>

}
function answerHTML(q){
  const t = T();
  if(q.varies){
    const key = q.varies;
    const linkKey = (key==="speaker"||key==="president"||key==="vice president"||key==="chief justice") ? "office" : key;
    const rawAns = q.a[lang].join("; ");
    const m = rawAns.match(/^(VARIES|VARÍA)\s*:\s*([^()]+?)\s*\(([^)]*(?:verificado|verified)[^)]*)\)\s*$/i);
    const current = m ? `<p class="answer">${esc(m[2].trim())}</p><p class="muted">${esc(m[3][0].toUpperCase()+m[3].slice(1))}</p>`
      : `<p class="muted">${esc(rawAns.replace(/^(VARIES|VARÍA)\s*/i,""))}</p>`;
    return `<div class="varies"><p><strong>${esc(t.variesTitle)}.</strong> ${esc(t.variesText)}</p>${current}
      <a href="${VARIES_LINK[key]}" target="_blank" rel="noopener">${esc(t.variesLinkLabel[linkKey]||t.variesLinkLabel.office)}</a></div>`;
  }
  return `<ul class="answers" aria-label="${esc(t.answersLabel)}">${q.a[lang].map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`;
}
function renderStudy(){
  const t = T(), el = view("study");
  const knownN = Q().filter(q=>known.has(qkey(q.n))).length;
  const browsing = studyCat==="all" && !studyStar && !studyQ.trim();
  const body = browsing
    ? `<ul class="list">${cats().map(c=>{ const p = catProgress(c); return rowBtn(`data-c="${esc(c)}"`, catLabel(c), p.known+" / "+p.total); }).join("")}</ul>`
    : `${studyCat!=="all"?heading(catLabel(studyCat)):""}<ul class="list" id="qlist"></ul>`;
  el.innerHTML = `${title("study")}
    <p class="stat">${esc(t.knownCount(knownN, Q().length))}</p>
    ${bar(knownN/Q().length*100)}
    <input id="qsearch" class="search" type="search" placeholder="${esc(t.searchPh)}" value="${esc(studyQ)}" aria-label="${esc(t.searchPh)}">
    <div class="seg" role="group">
      <button data-c="all" aria-pressed="${!studyStar}">${esc(t.all)}</button>
      <button data-s="1" aria-pressed="${studyStar}">65/20</button>
    </div>
    ${body}`;
  const ql = el.querySelector("#qlist");
  if(ql){
    const list = filteredQuestions();
    ql.innerHTML = list.length ? list.map(qCardHTML).join("") : `<li class="muted">${esc(t.noResults)}</li>`;
  }
  const si = el.querySelector("#qsearch");
  si.addEventListener("input", ()=>{
    studyQ = si.value; renderStudy();
    const again = view("study").querySelector("#qsearch"); again.focus(); again.setSelectionRange(studyQ.length, studyQ.length);
  });
}

/* ---------- practice (civics) ---------- */
function focusHTML(){
  const t = T(), rows = weakestCats();
  if(!rows.length) return `<p class="muted">${esc(t.focusEmpty)}</p>`;
  return `<ul class="list">${rows.map(r=>rowInfo(catLabel(r.c), Math.round(r.acc*100)+"%, "+t.focusTries(r.n))).join("")}</ul>
    <button class="link" id="weakBtn">${esc(t.weakBtn)}</button>`;
}
function historyHTML(){
  const t = T();
  if(!histLog.length) return `<p class="muted">${esc(t.historyEmpty)}</p>`;
  return `<ul class="list">${histLog.slice(-5).reverse().map(h=>{
    const bank = h.bank==="08" ? "2008" : h.bank==="25" ? "2025" : "";
    return rowInfo(h.right+"/"+h.total+" "+(h.pass?t.passMsg:t.failMsg), (bank?bank+", ":"")+h.d);
  }).join("")}</ul>`;
}
function renderPractice(){
  const el = view("practice");
  if(!pz) renderPracticeSetup(el);
  else if(pz.done) renderPracticeDone(el);
  else renderPracticeQuestion(el);
}
function renderPracticeSetup(el){
  const t = T(), before = filed==="before";
  const bank = before ? "08:" : "25:";
  const mcount = [...mistakes].filter(k=>k.startsWith(bank)).length, d = dueCount();
  el.innerHTML = `${title("practice")}
    <ul class="list">
      ${rowBtn('data-p="std"', before?t.testStd08:t.testStd, "", before?t.testStdDesc08:t.testStdDesc)}
      ${rowBtn('data-p="senior"', t.testSenior, "", t.testSeniorDesc)}
      ${mcount?rowBtn('data-p="review"', t.reviewBtn(mcount)):""}
      ${d?rowBtn('data-p="due"', t.dueBtn(d)):""}
    </ul>
    ${heading(t.focusH)}${focusHTML()}
    ${heading(t.historyH)}${historyHTML()}`;
  const wb = el.querySelector("#weakBtn");
  if(wb) wb.onclick = ()=>startWeakPractice();
}
function renderPracticeQuestion(el){
  const t = T(), q = pz.order[pz.idx];
  el.innerHTML = `${pz.mock?mockBanner(3):""}
    <p class="muted split"><span>${esc(t.qNum(pz.idx+1))}${q.cat?", "+esc(catLabel(q.cat)):""}</span>
      <span>${esc(t.correctToPass(pz.need))}, ${esc(t.wrongs(pz.wrong))}</span></p>
    ${bar(pz.idx/pz.order.length*100)}
    <p class="prompt">${esc(q.q[lang])}</p>
    <button class="link" id="hear">${esc(t.listen)}</button>
    <div id="pans"><button class="btn" id="showA">${esc(t.showAnswer)}</button></div>`;
  el.querySelector("#hear").onclick = ()=>speak(q.q[lang]);
  el.querySelector("#showA").onclick = ()=>{
    el.querySelector("#pans").innerHTML = answerHTML(q) + `<div class="pair">
      <button class="btn" data-r="y">${esc(t.iKnew)}</button>
      <button class="btn quiet" data-r="n">${esc(t.iMissed)}</button></div>`;
  };
}
function startPractice(mode, isMock){
  const review = mode==="review"||mode==="due", due = mode==="due", senior = mode==="senior", before = filed==="before";
  let pool;
  if(review) pool = Q().filter(q=>mistakes.has(qkey(q.n)) && (!due || srsDue(qkey(q.n))));
  else pool = senior ? Q().filter(q=>q.star) : Q();
  pool = shuffled(pool);
  const total = review ? Math.min(pool.length,20) : (senior?10:(before?10:20));
  const need = review ? Math.ceil(total*0.7) : (senior?6:(before?6:12));
  const maxWrong = review ? total+1 : (senior?5:(before?5:9));
  pz = {order:pool.slice(0,total), idx:0, right:0, wrong:0, need, maxWrong, missed:[], catRes:{}, done:false, senior, review, due, recorded:false, mock:!!isMock,
    bank: before?"08":"25"};
  saveRounds();
  renderPractice();
}
function drillCats(){
  const rows = weakestCats();
  const miss = rows.filter(r=>r.acc<1);
  return (miss.length?miss:rows).map(r=>r.c);
}
function startWeakPractice(){
  const weak = drillCats();
  if(!weak.length) return;
  const before = filed==="before";
  const pool = shuffled(Q().filter(q=>weak.includes(q.cat)));
  const total = Math.min(pool.length, before?10:20);
  if(total<3) return;
  const need = Math.min(before?6:12, Math.ceil(total*0.6));
  pz = {order:pool.slice(0,total), idx:0, right:0, wrong:0, need, maxWrong:total+1, missed:[], catRes:{}, done:false, senior:false, review:false, weak:true, recorded:false, mock:false,
    bank: before?"08":"25"};
  saveRounds();
  show("practice");
}
function practiceAnswer(ok){
  const q = pz.order[pz.idx], k = pz.bank+":"+q.n;
  const wasDue = srsDue(k);
  const cr = (pz.catRes[q.cat] = pz.catRes[q.cat] || {r:0,w:0});
  if(ok){ pz.right++; cr.r++; if(pz.review && wasDue) srsOnRight(k); }
  else {
    pz.wrong++; cr.w++; pz.missed.push(q);
    if(pz.review) srsOnMiss(k);
    else { mistakes.add(k); srsOnMiss(k); saveMistakes(); }
  }
  pz.idx++;
  const finished = pz.review ? pz.idx>=pz.order.length
    : (pz.right>=pz.need || pz.wrong>=pz.maxWrong || pz.idx>=pz.order.length);
  if(finished) pz.done = true;
  saveRounds();
  renderPractice();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderPracticeDone(el){
  const t = T(), pass = pz.right>=pz.need;
  if(!pz.recorded){
    pz.recorded = true;
    bumpStreak();
    histLog.push({d:dayStr(new Date()),
      mode: pz.review?(pz.due?"due":"review"):(pz.senior?"senior":(pz.weak?"weak":"std")),
      right:pz.right, total:pz.idx, pass, bank: pz.bank, cats:pz.catRes});
    saveHistory();
    pz.missed.forEach(q=>{ const k=pz.bank+":"+q.n; mistakes.add(k); srsOnMiss(k); }); saveMistakes();
  }
  if(pz.mock){ if(!mock) mock = {}; mock.civics = {right:pz.right, total:pz.idx, pass}; pz = null; startMockN400(); saveRounds(); return; }
  const bankLeft = [...mistakes].filter(k=>k.startsWith(pz.bank+":")).length;
  const good = pz.review ? bankLeft===0 : pass;
  const headMsg = pz.review ? (bankLeft===0 ? t.clearedAll : t.stillLeft(bankLeft)) : (pass ? t.passMsg : t.failMsg);
  el.innerHTML = `<h1 class="title ${good?"pass":"fail"}">${esc(headMsg)}</h1>
    <p class="stat"><span class="num">${pz.right}/${pz.idx}</span></p>
    ${pz.missed.length?`${heading(t.reviewMissed)}<ul class="list">${pz.missed.map(q=>
      `<li class="row"><span class="grow">${q.n}. ${esc(q.q[lang])}<span class="sub">${esc(q.a[lang].join(", "))}</span></span></li>`).join("")}</ul>`:""}
    <button class="btn" id="retry">${esc(t.tryAgain)}</button>
    <button class="link" id="newtest">${esc(t.backToSetup)}</button>`;
  announce(headMsg);
  el.querySelector("#retry").onclick = ()=>{ pz.weak ? startWeakPractice() : startPractice(pz.review?(pz.due?"due":"review"):(pz.senior?"senior":"std")); };
  el.querySelector("#newtest").onclick = ()=>{ pz=null; saveRounds(); renderPractice(); };
  saveRounds();
}

/* ---------- english: reading, dictation ---------- */
function renderEnglish(){
  if(rp && rp.idx < rp.order.length){ renderReadQ(); return; }
  if(dz && dz.idx < dz.order.length){ renderDictQ(); return; }

  el.innerHTML = `${title("english")}

      ${rowBtn('id="dictStart"', t.dictStart)}
      ${dzMistakes.size?rowBtn('id="dzReview"', t.reviewBtn(dzMistakes.size)):""}
